replicaCount: 1

image:
  repository: cosmoparrot
  tag: latest
  pullPolicy: IfNotPresent

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

service:
  name: cosmoparrot
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  host: cosmoparrot.example.com
  className:
  annotations:
  tls:
    enabled: false
    secretName: cosmoparrot-tls

resources:
  limits:
    cpu: "1"
    memory: "512Mi"
  requests:
    cpu: "0.5"
    memory: "256Mi"

cosmoparrot:
  # Log every incoming request (line, headers and body).
  # Set to false to disable per-request logging.
  requestLogging: true
  storeKeyRequestHeaders: []
  # Example:
  # storeKeyRequestHeaders:
  #   - X-Request-ID
  #   - X-Correlation-ID
  otel:
    enabled: false
    serviceName: cosmoparrot
    # Configure standard OTEL exporter environment variables.
    env:
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Example endpoint for an in-cluster collector service.
      # For traces, OTEL_EXPORTER_OTLP_TRACES_ENDPOINT takes precedence over OTEL_EXPORTER_OTLP_ENDPOINT.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_TIMEOUT: ""
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ""
      OTEL_EXPORTER_OTLP_INSECURE: ""
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: ""

imagePullSecrets: []

podAnnotations: {}

nodeSelector: {}

tolerations: []

# Rendered as-is into the pod spec.
affinity: {}
  # Example:
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: cosmoparrot
  #             app.kubernetes.io/instance: cosmoparrot

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # Set to a percentage to also scale on memory utilization.
  targetMemoryUtilizationPercentage:
  # Additional HPA metrics rendered as-is (e.g. pods or external metrics).
  extraMetrics: []
  # Rendered as-is into spec.behavior.
  behavior: {}
